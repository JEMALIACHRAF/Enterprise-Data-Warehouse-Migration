# =============================================================================
# CI Pipeline — Oracle to Snowflake Migration
#
# Triggers:
#   Pull request to main or develop  ->  lint + security + unit tests
#   Push to main                     ->  lint + security + unit tests
#
# Note: Docker build and GKE deployment jobs require GCP_SA_KEY secret.
# Configure via: GitHub Settings -> Secrets -> New repository secret
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.1.9

      - name: Check code style
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  # ---------------------------------------------------------------------------
  # JOB 2 — Security scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: |
          bandit -r src/ \
            --skip B101,B603,B607 \
            --severity-level medium \
            --confidence-level medium \
            -f txt

  # ---------------------------------------------------------------------------
  # JOB 3 — Unit Tests
  # Runs entirely in local Spark mode — no Oracle, Snowflake, or GCS required.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyspark==3.4.1 pytest==7.4.4 pytest-cov==4.1.0

      - name: Run unit tests
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          python -m pytest tests/unit/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results.xml
            coverage.xml